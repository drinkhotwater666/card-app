
name: Deploy

on:

  push:

    branches: [main]

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Bump cache version

        run: |

          sed -i "s/const CACHE = .*/const CACHE = 'card-app-$(date +%Y%m%d%H%M%S)';/" sw.js

      - name: Commit and push

        run: |

          git config user.name "github-actions"

          git config user.email "actions@github.com"

          git add sw.js

          git diff --staged --quiet || git commit -m "auto: bump cache version"

          git push


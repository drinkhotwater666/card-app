<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="神秘牌阵">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="tarot/愚人.png">
<title>神秘牌阵</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cinzel:wght@400;600&display=swap');
:root {
  --bg:#0d0a1a;--bg2:#13101f;--bg3:#1a1628;
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:#f5e4a8;
  --text:#e8dfc8;--text2:#a89880;
  --border:rgba(201,168,76,0.25);--border2:rgba(201,168,76,0.5);
  --radius:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Serif SC',serif;overflow:hidden;}
body{display:flex;flex-direction:column;min-height:100dvh;padding-top:var(--safe-top);padding-bottom:var(--safe-bot);}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(100,60,180,0.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(40,20,100,0.2) 0%,transparent 60%);}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,255,220,0.7);animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--safe-top) + 12px) 20px calc(var(--safe-bot) + 16px);z-index:1;transition:opacity 0.4s ease,transform 0.4s ease;overflow-y:auto;}
.screen.hidden{opacity:0;pointer-events:none;transform:translateY(20px);}

/* Setup */
#setup{gap:18px;align-items:center;}
.title-area{text-align:center;margin-bottom:4px;}
.title-en{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;opacity:0.8;}
.title-zh{font-size:26px;font-weight:600;color:var(--gold3);letter-spacing:0.12em;text-shadow:0 0 30px rgba(201,168,76,0.4);}
.divider{width:80px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:10px auto 0;}
.section{width:100%;max-width:340px;}
.section-label{font-size:11px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;font-family:'Cinzel',serif;opacity:0.8;}

/* Deck selector */
.deck-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.deck-btn{padding:14px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--text2);cursor:pointer;text-align:center;transition:all 0.25s;font-family:'Noto Serif SC',serif;}
.deck-btn .deck-icon{font-size:22px;margin-bottom:5px;}
.deck-btn .deck-name{font-size:14px;color:var(--text);font-weight:600;letter-spacing:0.05em;}
.deck-btn .deck-count{font-size:11px;color:var(--text2);margin-top:2px;}
.deck-btn.active{border-color:var(--gold);background:rgba(201,168,76,0.08);box-shadow:0 0 16px rgba(201,168,76,0.15),inset 0 0 20px rgba(201,168,76,0.05);}
.deck-btn.active .deck-name{color:var(--gold2);}

/* Lenormand version */
.len-version{display:none;flex-direction:column;gap:8px;margin-top:2px;}
.len-version.visible{display:flex;}
.radio-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);cursor:pointer;transition:all 0.2s;}
.radio-row.active{border-color:var(--gold);background:rgba(201,168,76,0.07);}
.radio-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;transition:all 0.2s;position:relative;}
.radio-row.active .radio-dot{border-color:var(--gold);background:var(--gold);}
.radio-label{font-size:13px;color:var(--text2);transition:color 0.2s;}
.radio-sub{font-size:11px;color:var(--text2);opacity:0.6;margin-left:auto;}
.radio-row.active .radio-label{color:var(--gold2);}

/* Count */
.count-row{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);overflow:hidden;}
.count-btn{width:52px;height:52px;background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;flex-shrink:0;transition:background 0.2s;}
.count-btn:active{background:rgba(201,168,76,0.12);}
.count-display{flex:1;text-align:center;font-size:26px;font-weight:600;color:var(--gold3);font-family:'Cinzel',serif;}
.count-sub{font-size:11px;color:var(--text2);text-align:center;margin-top:6px;letter-spacing:0.1em;}

/* Question input */
.question-wrap{width:100%;max-width:340px;}
.question-field{position:relative;}
.question-input{width:100%;padding:16px 52px 16px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Noto Serif SC',serif;font-size:14px;resize:none;min-height:136px;height:136px;max-height:42dvh;outline:none;transition:border-color 0.2s;line-height:1.6;overflow-y:hidden;}
.question-input::placeholder{color:var(--text2);opacity:0.5;}
.question-input:focus{border-color:var(--border2);}
.question-clear{position:absolute;top:10px;right:10px;border:1px solid var(--border);border-radius:999px;background:rgba(201,168,76,0.08);color:var(--text2);font-family:'Noto Serif SC',serif;font-size:11px;line-height:1;padding:7px 10px;cursor:pointer;transition:all 0.2s;}
.question-clear:active{border-color:var(--gold);color:var(--gold2);}
.question-clear.hidden{opacity:0;pointer-events:none;}

/* Start button */
.start-btn{width:100%;max-width:340px;padding:16px;border:1px solid var(--gold);border-radius:var(--radius);background:rgba(201,168,76,0.1);color:var(--gold2);font-family:'Cinzel',serif;font-size:14px;letter-spacing:0.25em;cursor:pointer;transition:all 0.3s;text-transform:uppercase;}
.start-btn:active{transform:scale(0.98);background:rgba(201,168,76,0.18);}
.start-btn:disabled{opacity:0.35;cursor:not-allowed;border-color:var(--border);}

/* Result screen */
#result{gap:0;overflow:hidden;}
.result-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.back-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--gold);padding:7px 14px;font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer;transition:all 0.2s;}
.back-btn:active{background:rgba(201,168,76,0.1);}
.result-title-wrap{text-align:center;}
.result-title{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:0.15em;text-transform:uppercase;}
.result-version{font-size:11px;color:var(--text2);margin-top:2px;letter-spacing:0.08em;}
.redraw-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:7px 12px;font-family:'Noto Serif SC',serif;font-size:12px;cursor:pointer;transition:all 0.2s;}
.redraw-btn:active{color:var(--gold);border-color:var(--gold);}

/* Card grid */
.cards-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 0 8px;-webkit-overflow-scrolling:touch;}
.cards-grid{display:flex;flex-direction:column;gap:16px;}
.card-reading{border:1px solid var(--border);border-radius:14px;background:rgba(26,22,40,0.82);padding:14px;display:flex;flex-direction:column;gap:14px;animation:cardReveal 0.5s ease both;}
.card-reading-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card-index{width:24px;height:24px;border-radius:50%;background:rgba(13,10,26,0.8);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:11px;color:var(--gold);flex-shrink:0;}
.card-title-group{display:flex;flex-direction:column;gap:4px;min-width:0;}
.card-title{font-size:18px;font-weight:600;letter-spacing:0.05em;color:var(--gold3);}
.card-state{font-size:11px;color:var(--text2);letter-spacing:0.12em;text-transform:uppercase;}
.card-reading-body{display:grid;grid-template-columns:minmax(132px,160px) minmax(0,1fr);gap:12px;align-items:start;}
.card-face-panel,.card-detail-panel{border:1px solid var(--border);border-radius:12px;background:rgba(13,10,26,0.55);overflow:hidden;}
.card-face-panel{padding:8px;}
.card-face-panel.reversed .card-face-img{transform:rotate(180deg);}
.card-face-img,.card-detail-img{width:100%;height:auto;display:block;}
.card-detail-panel{padding:10px;}
.card-detail-caption{font-size:11px;color:var(--text2);letter-spacing:0.08em;padding:0 2px 8px;}
.card-image-fallback{display:flex;align-items:center;justify-content:center;min-height:140px;padding:14px;color:var(--text2);font-size:12px;line-height:1.5;text-align:center;}
@keyframes cardReveal{from{opacity:0;transform:scale(0.85) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* Info bar */
.result-tools{display:flex;justify-content:flex-end;margin-top:10px;}
.info-bar{flex-shrink:0;margin-top:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;}
.info-question{font-size:12px;color:var(--text2);margin-bottom:6px;line-height:1.5;}
.info-question span{color:var(--text);margin-left:4px;}
.info-cards{font-size:11px;color:var(--text2);line-height:1.7;word-break:break-all;}
.info-cards span{color:var(--gold2);}
.copy-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:7px 10px;cursor:pointer;font-size:11px;transition:all 0.2s;display:flex;align-items:center;gap:4px;}
.copy-btn:active{color:var(--gold);border-color:var(--gold);}
.copy-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
.copy-toast{position:fixed;bottom:calc(var(--safe-bot) + 24px);left:50%;transform:translateX(-50%);background:rgba(201,168,76,0.15);border:1px solid var(--gold);border-radius:8px;padding:8px 18px;font-size:12px;color:var(--gold2);letter-spacing:0.1em;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:99;}
.copy-toast.show{opacity:1;}

/* Loading */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;transition:opacity 0.4s;}
#loading.gone{opacity:0;pointer-events:none;}
.loading-symbol{font-size:36px;animation:spin 2s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.loading-text{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.25em;color:var(--gold);text-transform:uppercase;opacity:0.7;}
.cards-scroll::-webkit-scrollbar{width:3px;}
.cards-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media (max-width:760px){
  .card-reading-body{grid-template-columns:1fr;}
  .card-face-panel{max-width:180px;margin:0 auto;}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="loading"><div class="loading-symbol">✦</div><div class="loading-text">Loading</div></div>
<div class="copy-toast" id="copy-toast">已复制</div>

<!-- Setup -->
<div class="screen" id="setup">
  <div class="title-area">
    <div class="title-en">Divination</div>
    <div class="title-zh">神秘牌阵</div>
    <div class="divider"></div>
  </div>

  <div class="section">
    <div class="section-label">选择牌组</div>
    <div class="deck-selector">
      <button class="deck-btn active" id="btn-tarot" onclick="selectDeck('tarot')">
        <div class="deck-icon">🌙</div>
        <div class="deck-name">塔罗</div>
        <div class="deck-count" id="tarot-count">78 张</div>
      </button>
      <button class="deck-btn" id="btn-lenormand" onclick="selectDeck('lenormand')">
        <div class="deck-icon">✦</div>
        <div class="deck-name">雷诺曼</div>
        <div class="deck-count" id="lenormand-count">36–48 张</div>
      </button>
    </div>
  </div>

  <div class="section" id="len-version-section" style="display:none;">
    <div class="section-label">雷诺曼版本</div>
    <div class="len-version visible" id="len-version">
      <label class="radio-row active" id="rv-traditional" onclick="selectLenVersion('traditional')">
        <div class="radio-dot"></div>
        <div class="radio-label">传统雷诺曼</div>
        <div class="radio-sub">36 张</div>
      </label>
      <label class="radio-row" id="rv-aecate" onclick="selectLenVersion('aecate')">
        <div class="radio-dot"></div>
        <div class="radio-label">AECATE 原创</div>
        <div class="radio-sub">48 张</div>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-label">抽取张数</div>
    <div class="count-row">
      <button class="count-btn" onclick="changeCount(-1)">−</button>
      <div class="count-display" id="count-display">3</div>
      <button class="count-btn" onclick="changeCount(1)">＋</button>
    </div>
    <div class="count-sub" id="count-sub">最多可抽 78 张</div>
  </div>

  <div class="question-wrap">
    <div class="section-label">我的问题</div>
    <div class="question-field">
      <textarea class="question-input" id="question" placeholder="在此输入你想询问的问题…"></textarea>
      <button class="question-clear hidden" id="question-clear" type="button" onclick="clearQuestion()" title="清除文本">清空</button>
    </div>
  </div>

  <button class="start-btn" id="start-btn" onclick="startDraw()">✦ &nbsp; 开始占卜 &nbsp; ✦</button>
</div>

<!-- Result -->
<div class="screen hidden" id="result">
  <div class="result-header">
    <button class="back-btn" onclick="showSetup()">← 返回</button>
    <div class="result-title-wrap">
      <div class="result-title">牌阵</div>
      <div class="result-version" id="result-version"></div>
    </div>
    <button class="redraw-btn" onclick="startDraw()">重抽</button>
  </div>
  <div class="cards-scroll">
    <div class="cards-grid" id="cards-grid"></div>
  </div>
  <div class="result-tools">
    <button class="copy-btn" onclick="copyInfo()" title="复制">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      复制结果
    </button>
  </div>
  <div class="info-bar" id="info-bar">
    <div class="info-question" id="info-question"></div>
    <div class="info-cards" id="info-cards"></div>
  </div>
</div>

<script>
// Stars
const starsEl=document.getElementById('stars');
for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${0.3+Math.random()*0.7}`;starsEl.appendChild(s);}

// State
let manifest={tarot:[],lenormand_traditional:[],lenormand_aecate:[]};
let deck='tarot';
let lenVersion='traditional';
let count=3;
let lastDrawn=[];
let lastQuestion='';
const questionEl=document.getElementById('question');
const questionClearEl=document.getElementById('question-clear');
const LENORMAND_TITLES={
  rider:'骑士',clover:'四叶草',ship:'船',house:'房子',tree:'树',clouds:'云',snake:'蛇',coffin:'棺材',
  bouquet:'花束',scythe:'镰刀',whip:'鞭子',birds:'鸟',child:'孩童',fox:'狐狸',bear:'熊',star:'星星',
  stork:'鹳',dog:'狗',tower:'塔',garden:'花园',mountain:'山',crossroads:'道路',mice:'老鼠',heart:'心',
  ring:'戒指',book:'书',letter:'信',man:'男人',woman:'女人',lily:'百合花',sun:'太阳',moon:'月亮',
  key:'钥匙',fish:'鱼',anchor:'锚',cross:'十字架',apple:'苹果',lamb:'羔羊',photo:'照片',console:'游戏机',
  wardrobes:'衣柜',flag:'旗帜',hotSpring:'温泉',owl:'猫头鹰',pawn:'棋子',crown:'王冠',rocket:'火箭',cactus:'仙人掌'
};
const TAROT_NUMERALS={'10':'十','9':'九','8':'八','7':'七','6':'六','5':'五','4':'四','3':'三','2':'二'};

// Version labels
const VERSION_LABELS={
  tarot:'塔罗牌',
  traditional:'传统雷诺曼',
  aecate:'AECATE 原创雷诺曼'
};

async function loadManifest(){
  try{
    const r=await fetch('./cards-manifest.json?t='+Date.now());
    if(!r.ok)throw new Error();
    manifest=await r.json();
    document.getElementById('tarot-count').textContent=manifest.tarot.length+' 张';
    document.getElementById('start-btn').disabled=false;
    updateCountSub();
  }catch{
    document.getElementById('start-btn').disabled=true;
  }
  document.getElementById('loading').classList.add('gone');
  resetQuestion();
}

function selectDeck(d){
  deck=d;
  document.getElementById('btn-tarot').classList.toggle('active',d==='tarot');
  document.getElementById('btn-lenormand').classList.toggle('active',d==='lenormand');
  document.getElementById('len-version-section').style.display=d==='lenormand'?'block':'none';
  updateCountSub();
  clampCount();
}

function selectLenVersion(v){
  lenVersion=v;
  document.getElementById('rv-traditional').classList.toggle('active',v==='traditional');
  document.getElementById('rv-aecate').classList.toggle('active',v==='aecate');
  updateCountSub();
  clampCount();
}

function getDeckKey(){
  return deck==='tarot'?'tarot':'lenormand_'+lenVersion;
}

function getMax(){
  return manifest[getDeckKey()]?.length||0;
}

function updateCountSub(){
  const max=getMax();
  document.getElementById('count-sub').textContent='最多可抽 '+max+' 张';
}

function clampCount(){
  const max=getMax();
  if(count>max&&max>0){count=max;document.getElementById('count-display').textContent=count;}
}

function changeCount(delta){
  const max=getMax()||78;
  count=Math.max(1,Math.min(max,count+delta));
  document.getElementById('count-display').textContent=count;
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getCardBaseName(src){
  return decodeURIComponent(src).split('/').pop().replace(/\.png$/i,'');
}

function getCardTitle(src){
  const base=getCardBaseName(src);
  if(src.startsWith('tarot/')){
    let title=base.replace(/10|9|8|7|6|5|4|3|2/g,m=>TAROT_NUMERALS[m]||m);
    if(title.endsWith('ace'))title=title.replace(/ace$/,'王牌');
    title=title.replace(/皇后/g,'女王');
    if(title==='魔术师')title='魔法师';
    if(title==='世界')title='宇宙';
    return title;
  }
  return LENORMAND_TITLES[base]||base;
}

function getDetailImagePath(src){
  return 'card-details/'+src;
}

function isTarotCard(src){
  return src.startsWith('tarot/');
}

function autoResizeQuestion(){
  const minHeight=136;
  const maxHeight=Math.max(minHeight,Math.floor(window.innerHeight*0.42));
  questionEl.style.height='auto';
  const nextHeight=Math.min(Math.max(questionEl.scrollHeight,minHeight),maxHeight);
  questionEl.style.height=nextHeight+'px';
  questionEl.style.overflowY=questionEl.scrollHeight>maxHeight?'auto':'hidden';
}

function updateQuestionControls(){
  questionClearEl.classList.toggle('hidden',!questionEl.value.trim());
  autoResizeQuestion();
}

function clearQuestion(){
  questionEl.value='';
  updateQuestionControls();
  questionEl.focus();
}

function resetQuestion(){
  questionEl.value='';
  updateQuestionControls();
}

function startDraw(){
  const pool=manifest[getDeckKey()];
  if(!pool||pool.length===0)return;
  const isTarot=deck==='tarot';
  lastQuestion=questionEl.value.trim();
  const drawn=shuffle(pool).slice(0,count).map(src=>({
    src,
    reversed:isTarot&&Math.random()<0.5
  }));
  lastDrawn=drawn;
  renderCards(drawn);
  // Version label
  const vLabel=deck==='tarot'?VERSION_LABELS.tarot:VERSION_LABELS[lenVersion];
  document.getElementById('result-version').textContent=vLabel;
  // Info bar
  const qEl=document.getElementById('info-question');
  if(lastQuestion){qEl.innerHTML='问题：<span>'+escHtml(lastQuestion)+'</span>';}
  else{qEl.innerHTML='';}
  const names=drawn.map(c=>getCardTitle(c.src)+(c.reversed?' [逆位]':''));
  document.getElementById('info-cards').innerHTML='抽到：<span>'+names.join('、')+'</span>';
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function renderCards(drawn){
  const grid=document.getElementById('cards-grid');
  grid.innerHTML='';
  drawn.forEach((c,i)=>{
    const title=getCardTitle(c.src);
    const detailPath=getDetailImagePath(c.src);
    const card=document.createElement('article');
    card.className='card-reading';
    card.style.animationDelay=(i*0.05)+'s';

    const header=document.createElement('div');
    header.className='card-reading-header';

    const index=document.createElement('div');
    index.className='card-index';
    index.textContent=i+1;

    const titleGroup=document.createElement('div');
    titleGroup.className='card-title-group';

    const titleEl=document.createElement('div');
    titleEl.className='card-title';
    titleEl.textContent=title;

    const stateEl=document.createElement('div');
    stateEl.className='card-state';
    stateEl.textContent=isTarotCard(c.src)?(c.reversed?'逆位':'正位'):'牌义详解';

    titleGroup.appendChild(titleEl);
    titleGroup.appendChild(stateEl);
    header.appendChild(index);
    header.appendChild(titleGroup);

    const body=document.createElement('div');
    body.className='card-reading-body';

    const facePanel=document.createElement('div');
    facePanel.className='card-face-panel'+(c.reversed?' reversed':'');
    const faceImg=document.createElement('img');
    faceImg.className='card-face-img';
    faceImg.src=encodeURI(c.src);
    faceImg.alt=title+'卡面';
    faceImg.loading='lazy';
    faceImg.onerror=()=>renderImageFallback(facePanel,'卡面图片加载失败：'+c.src);
    facePanel.appendChild(faceImg);

    const detailPanel=document.createElement('div');
    detailPanel.className='card-detail-panel';
    const detailCaption=document.createElement('div');
    detailCaption.className='card-detail-caption';
    detailCaption.textContent='详细信息';
    const detailImg=document.createElement('img');
    detailImg.className='card-detail-img';
    detailImg.src=encodeURI(detailPath);
    detailImg.alt=title+'详细信息';
    detailImg.loading='lazy';
    detailImg.onerror=()=>renderImageFallback(detailPanel,'详情图尚未就绪：'+detailPath,detailCaption);
    detailPanel.appendChild(detailCaption);
    detailPanel.appendChild(detailImg);

    body.appendChild(facePanel);
    body.appendChild(detailPanel);
    card.appendChild(header);
    card.appendChild(body);
    grid.appendChild(card);
  });
  document.querySelector('.cards-scroll').scrollTop=0;
}

function showSetup(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  resetQuestion();
  document.getElementById('setup').scrollTop=0;
}

function renderImageFallback(container,text,keepNode){
  container.innerHTML='';
  if(keepNode)container.appendChild(keepNode);
  const fallback=document.createElement('div');
  fallback.className='card-image-fallback';
  fallback.textContent=text;
  container.appendChild(fallback);
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function copyInfo(){
  const names=lastDrawn.map(c=>getCardTitle(c.src)+(c.reversed?' [逆位]':''));
  const vLabel=deck==='tarot'?VERSION_LABELS.tarot:VERSION_LABELS[lenVersion];
  let text='';
  if(lastQuestion)text+='问题：'+lastQuestion+'\n';
  text+='牌组：'+vLabel+'\n';
  text+='抽到：'+names.join('、');
  navigator.clipboard.writeText(text).then(()=>{
    const t=document.getElementById('copy-toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),1800);
  });
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
questionEl.addEventListener('input',updateQuestionControls);
window.addEventListener('resize',autoResizeQuestion);
window.addEventListener('pageshow',()=>{
  if(!document.getElementById('result').classList.contains('hidden'))return;
  resetQuestion();
});
loadManifest();
</script>
</body>
</html>
